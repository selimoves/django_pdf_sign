name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --all-extras
      - run: uv build
      - run: uv run twine check dist/*
      - name: Check version matches tag
        run: |
          uv run python -c "import glob,os,zipfile;tag=os.environ['GITHUB_REF_NAME'].lstrip('v');w=glob.glob('dist/*.whl')[0];z=zipfile.ZipFile(w);m=next(n for n in z.namelist() if n.endswith('METADATA'));assert f'Version: {tag}' in z.read(m).decode(), tag"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { attestations: true }
