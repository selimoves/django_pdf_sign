name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / django${{ matrix.django }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - python: "3.11"
            django: "4.2"
          - python: "3.11"
            django: "5.2"
          - python: "3.12"
            django: "4.2"
          - python: "3.12"
            django: "5.2"
          - python: "3.12"
            django: "6.1"
          - python: "3.13"
            django: "5.2"
          - python: "3.13"
            django: "6.1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install "django~=${{ matrix.django }}.0"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        if: matrix.python == '3.13' && matrix.django == '6.1'
        run: uv run python -m mypy

      - name: Test
        run: uv run pytest -q

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - run: uv sync --all-extras
      - run: uv build
      - run: uv run twine check dist/*
