[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-pdf-sign"
version = "0.1.0.dev0"
description = "Client-side electronic signatures for PDF documents in Django: GOST 34.10-2012 (qualified signatures) and PAdES (RSA/ECDSA)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Eldar S. Selimov", email = "selimoves@gmail.com" },
]
keywords = [
  "django",
  "pdf",
  "signature",
  "electronic-signature",
  "pades",
  "gost",
  "gost-34.10-2012",
  "cades",
  "qualified-signature",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "django>=4.2",
  "pyhanko[opentype]>=0.38,<0.39",
  "asn1crypto>=1.5.1",
  "cryptography>=48",
  "gostcrypto>=1.2.5",
]

[project.optional-dependencies]
qr = ["pyhanko[qr]>=0.38,<0.39"]
dev = [
  "build>=1.2",
  "django-stubs>=5.0",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-django>=4.9",
  "ruff>=0.9",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/selimoves/django_pdf_sign"
Documentation = "https://github.com/selimoves/django_pdf_sign#readme"
Issues = "https://github.com/selimoves/django_pdf_sign/issues"
Source = "https://github.com/selimoves/django_pdf_sign"

[tool.hatch.build.targets.wheel]
packages = ["src/django_pdf_sign"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "cryptopro_interop: интероп-проверка с реальным КриптоПро CSP (нужен Docker)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pyhanko.*",
  "ignore::DeprecationWarning:pyhanko_certvalidator.*",
  "ignore::ResourceWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["django_pdf_sign"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs", "README.md", "src/django_pdf_sign/migrations", "docker"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
]
ignore = [
  "RUF001", # ambiguous unicode in strings: Russian text is intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["django_pdf_sign", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
files = ["src/django_pdf_sign"]
mypy_path = ["src", "."]
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["migrations/", "docker/"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = ["gostcrypto.*", "asn1crypto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["django_pdf_sign.crypto.certs"]
disallow_subclassing_any = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["django_pdf_sign.admin"]
disallow_any_generics = false
